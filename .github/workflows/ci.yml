name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Two operating systems on purpose. `volsurf` is a numerical library whose
    # README pins printed digits, and glibc and Apple libm do not have to agree
    # to the last ulp on erf/exp/log — running both is what keeps the pinned
    # numbers honest rather than merely reproducible on one machine.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: PYTHONPATH=. python examples/validate.py
